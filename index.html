<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Luowen Assets</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #172033;
        background: #f7f8fa;
      }
      body {
        margin: 0;
        padding: 32px;
      }
      main {
        max-width: 960px;
        margin: 0 auto;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 28px;
        line-height: 1.2;
      }
      p {
        margin: 0 0 24px;
        color: #5d6778;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 16px;
      }
      .asset {
        border: 1px solid #dde2ea;
        border-radius: 8px;
        background: #ffffff;
        overflow: hidden;
      }
      .preview {
        display: grid;
        min-height: 220px;
        place-items: center;
        padding: 24px;
      }
      .preview.dark {
        background: #121820;
      }
      .preview.light {
        background: #ffffff;
      }
      img {
        max-width: 100%;
        max-height: 160px;
      }
      .meta {
        border-top: 1px solid #dde2ea;
        padding: 12px;
      }
      .name {
        margin: 0 0 8px;
        font-weight: 600;
      }
      code {
        display: block;
        overflow-wrap: anywhere;
        color: #40516c;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Luowen Assets</h1>
      <p>Long-term public brand assets.</p>
      <section class="grid" aria-label="Logo assets">
        <article class="asset">
          <div class="preview dark">
            <img src="brand/logo/luowen-logo-white-transparent.png" alt="White transparent Luowen logo">
          </div>
          <div class="meta">
            <div class="name">White transparent logo</div>
            <code>brand/logo/luowen-logo-white-transparent.png</code>
          </div>
        </article>
        <article class="asset">
          <div class="preview light">
            <img src="brand/logo/luowen-logo-white-on-dark-preview.png" alt="Luowen logo on dark preview background">
          </div>
          <div class="meta">
            <div class="name">Dark preview logo</div>
            <code>brand/logo/luowen-logo-white-on-dark-preview.png</code>
          </div>
        </article>
        <article class="asset">
          <div class="preview light">
            <img src="brand/logo/luowen-logo-dark-transparent.png" alt="Dark transparent Luowen logo">
          </div>
          <div class="meta">
            <div class="name">Dark transparent logo</div>
            <code>brand/logo/luowen-logo-dark-transparent.png</code>
          </div>
        </article>
      </section>
    </main>
  </body>
</html>
